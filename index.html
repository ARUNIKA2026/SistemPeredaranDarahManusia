<style>
/* Gaya dasar asli (komponen & tata letak), dirapikan per baris */

:root{--bg:#FFF7F0;--card:#fff;--ink:#3A2230;--red:#D92B44;--dk:#9B1428;--blue:#2F7FD8;--amb:#E8A317;--line:#F0D4C6;--soft:#FFEDE3;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241520;--card:#3A2433;--ink:#FDEFF2;--line:#6B3A4A;--soft:#4A2B3A}
}
:root[data-theme="dark"]{--bg:#241520;--card:#3A2433;--ink:#FDEFF2;--line:#6B3A4A;--soft:#4A2B3A}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:600 1.02rem/1.6 Nunito,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
h1,h2,h3,button,.btn{font-family:"Baloo 2",sans-serif;margin:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;gap:8px;align-items:center;padding:8px 14px;background:var(--card);border-bottom:3px solid var(--line)}
header b{margin-left:auto;font-family:"Baloo 2";color:var(--red)}
main{max-width:820px;width:calc(100% - 16px);margin:12px auto;padding:18px 14px 60px;border-radius:24px;background:var(--bg);background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.yw .fb{display:none;position:absolute;inset:0;place-content:center;justify-items:center;gap:6px;text-align:center;background:linear-gradient(160deg,#D92B44,#7B1226);color:#fff;text-decoration:none;font:800 .9rem "Baloo 2",sans-serif;padding:8px}
.yw .fb span{font-size:2.2rem;line-height:1}
.yw.bl iframe{display:none}
.yw.bl .fb{display:grid}
#snd{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9;width:46px;height:46px;border-radius:50%;padding:0;font-size:1.3rem;background:var(--card);color:var(--ink);border:3px solid var(--line);box-shadow:0 3px 8px #0004}
.gd{display:flex;gap:12px;align-items:flex-start}
.gd .n{flex:none;width:48px;height:48px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:1.6rem}
.gd h2{font-size:1.1rem;color:var(--red)}
.gd p{margin:2px 0 0}

:root[data-theme="dark"] #bg{filter:brightness(.5)}
button,.btn{display:inline-block;font-size:1rem;font-weight:800;background:var(--red);color:#fff;border:0;border-radius:14px;padding:8px 16px;cursor:pointer;box-shadow:0 4px 0 var(--dk);text-decoration:none;touch-action:manipulation}
button:active,.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--dk)}
button:focus-visible,.btn:focus-visible,a:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
header button{background:none;color:var(--red);border:2px solid var(--red);box-shadow:none;padding:4px 12px}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:16px;margin:14px 0;box-shadow:0 6px 0 var(--line)}
.hero{text-align:center;min-height:84vh;display:grid;place-content:center;gap:12px;position:relative}
.hero h1{font-size:clamp(2rem,8vw,3rem);line-height:1.05;color:var(--red)}
.hb{display:inline-block;animation:hb 1.1s infinite}
@keyframes hb{15%{transform:scale(1.15)}
30%{transform:scale(1)}
}
.cell{position:absolute;border-radius:50%;background:var(--red);opacity:.35;animation:dr 8s ease-in-out infinite}
@keyframes dr{50%{transform:translate(14px,-22px)}
}
.menu{display:grid;gap:14px}
.mc{display:flex;gap:14px;align-items:center;text-decoration:none;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 6px 0 var(--line);transition:transform .15s}
.mc:hover{transform:translateY(-3px)}
.mc h2{font-size:1.3rem;color:var(--red)}
.mc p{margin:2px 0 0}
.mc .ic{flex:none;width:72px;height:72px;border-radius:20px;background:var(--soft);display:grid;place-items:center}
.org{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.oc{background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:20px;padding:8px;box-shadow:0 4px 0 var(--line);text-align:center}
.oc[aria-pressed=true]{border-color:var(--c);box-shadow:0 4px 0 var(--c)}
.oc span{display:block;font-size:1.05rem}
.ph{display:grid;place-items:center;gap:4px;aspect-ratio:1;border:2px dashed var(--line);border-radius:14px;background:var(--soft);font-size:.8rem;text-align:center;padding:6px}
.ph svg{width:48px;height:48px}
img,video{max-width:100%;display:block;border-radius:14px}
.org img{width:100%;aspect-ratio:1;object-fit:contain}
.fig{margin:12px 0}
.fig .ph{aspect-ratio:16/9}
.fig img{margin:auto;max-height:420px}
.fig figcaption{font-size:.85rem;text-align:center;margin-top:4px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tabs button{background:var(--soft);color:var(--ink);box-shadow:0 3px 0 var(--line);padding:6px 12px;font-size:.95rem}
.tabs button[aria-selected=true]{background:var(--c);color:#fff;box-shadow:0 3px 0 #0003}
.pn{background:var(--soft);border-radius:16px;padding:12px 14px;animation:pp .25s}
@keyframes pp{from{opacity:.3;transform:translateY(6px)}
}
.pn ul{margin:6px 0 0;padding-left:20px}
.al{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.al span{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:3px 10px;font-weight:800;font-size:.9rem;transition:.3s}
.al span.on{background:var(--c);color:#fff;border-color:var(--c);transform:scale(1.08)}
.al i{font-style:normal}
.nx{display:flex;justify-content:space-between;gap:8px;margin-top:18px}
.ob{display:grid;grid-template-columns:minmax(200px,280px) 1fr;gap:16px;align-items:start}
@media(max-width:560px){.ob{grid-template-columns:1fr}
.bm{max-width:260px;margin:0 auto}
}
.bm{position:relative}
.bm img{width:100%}
.hs{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid #fff;background:#D92B4499;box-shadow:0 0 0 2px #D92B44;cursor:pointer;animation:hsp 1.6s ease-in-out infinite}
@keyframes hsp{50%{transform:scale(1.25);background:#D92B44dd}
}
.hs.lp{width:64px;height:64px;margin:-32px 0 0 -32px;border-width:4px;animation:lpp 2s ease-in-out infinite;background:radial-gradient(circle at 30% 35%,#D92B44 0 9px,transparent 10px),radial-gradient(circle at 68% 42%,#D92B44 0 8px,transparent 9px),radial-gradient(circle at 42% 72%,#D92B44 0 9px,transparent 10px),#FFD7DD;box-shadow:0 0 0 2px #D92B44,0 4px 10px #0003}
@keyframes lpp{50%{transform:scale(1.1)}
}
.tl{position:absolute;display:grid;place-items:center;color:#fff;font:800 clamp(.8rem,3.4vw,1.15rem)/1 "Baloo 2",sans-serif;white-space:nowrap;text-shadow:0 1px 2px #0006}
.zw{overflow:hidden;border-radius:16px;background:#fff;border:3px solid var(--line)}
.zi{position:relative;transform-origin:0 0;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.zi img{width:100%;display:block;border-radius:0}
.zh{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid #D92B44;background:#fff4;cursor:pointer;transform:scale(calc(1/var(--s,1)));animation:zp 1.6s ease-in-out infinite}
@keyframes zp{50%{box-shadow:0 0 0 9px #D92B4455}
}
.zw{position:relative}
.cb{position:absolute;z-index:3;background:var(--card);color:var(--ink);border:3px solid #D92B44;border-radius:14px;padding:8px 10px;font-size:.85rem;line-height:1.35;box-shadow:0 4px 14px #0005;animation:pp .25s}
.cb[hidden]{display:none}
.cx{float:right;margin:0 0 4px 6px;padding:0 8px;font-size:.8rem;box-shadow:none;border-radius:10px}
.pbar{height:10px;background:var(--soft);border-radius:9px;overflow:hidden;margin:6px 0}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#E8A317,#D92B44);transition:width .4s}
.opts{display:grid;gap:10px;margin:12px 0}
.opt{background:var(--card);color:var(--ink);border:3px solid var(--line);box-shadow:0 4px 0 var(--line);text-align:left;font:800 1rem Nunito,sans-serif;padding:12px 14px}
.opt:disabled{opacity:.7;cursor:default}
.opt.ok{background:#2FAE7C;color:#fff;border-color:#1d8a60;box-shadow:0 4px 0 #1d8a60;opacity:1}
.opt.no{background:#D92B44;color:#fff;border-color:#9B1428;box-shadow:0 4px 0 #9B1428;opacity:1}
.qm{display:flex;gap:10px;align-items:center}
.ms{flex:none;width:92px}
.ms svg{width:100%;height:auto;display:block}
.ms.hp{animation:bn .6s}
.ms.sd,.shake{animation:sk .45s}
@keyframes bn{30%{transform:translateY(-16px) scale(1.08)}
60%{transform:translateY(0)}
80%{transform:translateY(-6px)}
}
@keyframes sk{25%{transform:translateX(-8px)}
75%{transform:translateX(8px)}
}
.bub{background:var(--soft);border-radius:16px;padding:8px 12px;font-weight:800}
.qt{font-size:1.2rem;margin:12px 0 4px}
.okt{color:#1d8a60;margin:8px 0}
.not{color:#C0213A;margin:8px 0}
.cf{position:absolute;bottom:40%;font-size:1.4rem;pointer-events:none;animation:up 1.5s ease-out forwards}
@keyframes up{to{transform:translate(var(--x,0),-170px) rotate(40deg);opacity:0}
}
.vbtn{display:flex;gap:8px;align-items:center;justify-content:center;max-width:340px;margin:12px auto 0;padding:12px 16px;border-radius:16px;background:linear-gradient(160deg,#D92B44,#7B1226);color:#fff;text-decoration:none;font:800 1rem "Baloo 2",sans-serif;box-shadow:0 4px 0 #5a0d1c;text-align:center}
.vbtn span{font-size:1.6rem;line-height:1}
#pnl{position:fixed;inset:0;z-index:30;background:#000a;display:grid;place-items:center;padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.pb{position:relative;background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:22px;padding:18px;max-width:560px;width:100%;max-height:100%;overflow:auto;animation:pp .25s}
.px{position:absolute;top:10px;right:10px;padding:2px 10px;box-shadow:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}
}
/* ===== Tema "Ceria 3D": latar #F4F9F9 + Coral #FF6B6B, Turquoise #4ECDC4, Sunny Yellow #FFE66D ===== */
:root{--bg:#F4F9F9;--card:#FFFFFF;--ink:#2D3142;--red:#FF6B6B;--blue:#4ECDC4;--amb:#FFE66D;--dk:#B83A3A;--edge:#2D3142;--btn-ink:#2D3142;--line:#CFE6E4;--soft:#E3F4F2;--ok:#1C7C74;--no:#B83A3A;--sh:5px 6px 0 var(--edge)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#162026;--card:#22323A;--ink:#F4F9F9;--edge:#0A1114;--line:#3E5760;--soft:#2B424A;--ok:#6FE3DA;--no:#FF9A9A;--dk:#FF9A9A}}
:root[data-theme="dark"]{--bg:#162026;--card:#22323A;--ink:#F4F9F9;--edge:#0A1114;--line:#3E5760;--soft:#2B424A;--ok:#6FE3DA;--no:#FF9A9A;--dk:#FF9A9A}
body{font:600 1.05rem/1.7 Nunito,sans-serif}

h1,h2{color:var(--ink)!important;letter-spacing:-.01em}
h1{font-size:clamp(1.7rem,6.5vw,2.4rem);line-height:1.2;display:inline;background:linear-gradient(transparent 60%,var(--amb) 60%);padding:0 .15em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hero h1{display:inline-block}
main a:not(.btn):not(.mc):not(.vbtn){color:var(--dk)!important}
main{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;animation:fu .5s both}main>*{animation:fu .5s both}
@keyframes fu{from{opacity:0;transform:translateY(14px)}}
/* Header */
header{background:var(--card);border-bottom:4px solid var(--edge);box-shadow:none;gap:10px}
header button:first-of-type{background:var(--amb)}header button:nth-of-type(2){background:var(--blue)}
header button{box-shadow:0 4px 0 var(--edge);padding:5px 14px;font-size:.95rem}
.hp{margin-left:auto;flex:1;min-width:90px;max-width:150px;font:800 .8rem "Baloo 2",sans-serif;color:var(--ink)}.hp .pbar{height:12px;margin:2px 0 0}
/* ===== Tombol 3D ===== */
button,.btn{background:var(--red);color:var(--btn-ink)!important;border:3px solid var(--edge);border-radius:20px;padding:9px 22px;font-weight:800;box-shadow:0 6px 0 var(--edge);transition:transform .12s,box-shadow .12s;text-decoration:none}
button:hover,.btn:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--edge)}
button:active,.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--edge)}
.btn[style*="var(--blue)"]{background:var(--blue)!important}
.px,.cx{border-radius:14px;box-shadow:0 3px 0 var(--edge);background:var(--amb);padding:0 10px}.px:active,.cx:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.vbtn{border:3px solid var(--edge);border-radius:22px;background:var(--blue);color:var(--btn-ink);box-shadow:0 6px 0 var(--edge);transition:transform .12s,box-shadow .12s}.vbtn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--edge)}
#snd,#thm{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9;width:52px;height:52px;border-radius:50%;padding:0;font-size:1.3rem;box-shadow:0 5px 0 var(--edge)}
#snd{left:12px;background:var(--amb)}#thm{left:72px;background:var(--blue)}
.tabs button{background:var(--card);color:var(--ink)!important;box-shadow:0 4px 0 var(--edge);padding:6px 16px;border-radius:18px}
.tabs button[aria-selected=true]{background:var(--c);transform:translateY(2px);box-shadow:0 2px 0 var(--edge)}
/* ===== Kartu dinamis, sudut asimetris, border tebal ===== */
.card,.pb{background:var(--card);border:3px solid var(--edge);border-radius:30px 16px 30px 16px;box-shadow:var(--sh)}
.card{transition:transform .2s}.card:hover{transform:rotate(-.6deg)}
.menu{gap:22px}
.mc{border:3px solid var(--edge);box-shadow:var(--sh);padding:18px;transition:transform .2s,box-shadow .2s}
.mc:nth-child(1){border-radius:34px 18px 34px 18px;background:color-mix(in srgb,var(--amb) 40%,var(--card));transform:rotate(-1.2deg)}
.mc:nth-child(2){border-radius:18px 34px 18px 34px;background:color-mix(in srgb,var(--blue) 30%,var(--card));transform:rotate(1deg)}
.mc:nth-child(3){border-radius:28px 14px 38px 14px;background:color-mix(in srgb,var(--red) 28%,var(--card));transform:rotate(-.7deg)}
.mc:hover{transform:rotate(0) scale(1.03) translateY(-4px);box-shadow:8px 10px 0 var(--edge)}
.mc:active{transform:scale(.98);box-shadow:2px 3px 0 var(--edge)}
.mc .ic{background:var(--card);border:3px solid var(--edge);border-radius:50% 40% 50% 40%;width:78px;height:78px}
.pn{background:var(--soft);border:3px dashed var(--edge);border-radius:22px 10px 22px 10px;animation:pp .25s}
.zw{border:3px solid var(--edge);border-radius:26px 14px 26px 14px;box-shadow:var(--sh)}
.fig img{border:3px solid var(--edge);border-radius:20px}
.cb{border:3px solid var(--edge);border-radius:18px 8px 18px 8px;background:var(--amb);color:var(--btn-ink)}
.bub{border:3px solid var(--edge);background:var(--card);border-radius:22px 22px 22px 4px}
.pbar{height:16px;background:var(--card);border:3px solid var(--edge);border-radius:99px}.pbar i{background:repeating-linear-gradient(45deg,var(--red) 0 10px,#FF8E8E 10px 20px);border-radius:99px}
.al span{background:var(--card);border:3px solid var(--edge);border-radius:14px}.al span.on{background:var(--c);color:var(--btn-ink);transform:scale(1.1) rotate(-2deg)}
/* Kuis */
.opt{background:var(--card);color:var(--ink);border:3px solid var(--edge);border-radius:20px;box-shadow:0 5px 0 var(--edge);transition:transform .12s,box-shadow .12s}
.opt:hover:not(:disabled){transform:translateY(-2px) rotate(-.5deg);box-shadow:0 7px 0 var(--edge);background:var(--amb);color:var(--btn-ink)}
.opt:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.opt.ok{background:var(--blue);color:var(--btn-ink);border-color:var(--edge);box-shadow:0 5px 0 var(--edge)}
.opt.no{background:var(--red);color:var(--btn-ink);border-color:var(--edge);box-shadow:0 5px 0 var(--edge)}
.okt{color:var(--ok)}.not{color:var(--no)}
/* Animasi hidup */
.hb{position:relative;animation:hb 1.1s infinite;filter:drop-shadow(0 10px 0 rgba(0,0,0,.12))}
.hb::before,.hb::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid var(--red);opacity:0;animation:rg 1.1s infinite}.hb::after{animation-delay:.25s}
@keyframes rg{0%{transform:scale(.8);opacity:.6}100%{transform:scale(1.6);opacity:0}}
.hero p{font-size:1.1rem}.cell{background:var(--blue);opacity:.5}.cell+.cell{background:var(--amb)}
.hs,.zh{touch-action:manipulation;border-color:var(--edge)}
.hs::after,.zh::after{content:"";position:absolute;inset:-9px}
#pnl{background:rgba(22,32,38,.65);animation:fo .2s}@keyframes fo{from{opacity:0}}
.pb{animation:pop .3s cubic-bezier(.3,1.5,.5,1)}@keyframes pop{from{opacity:0;transform:scale(.85) rotate(-3deg)}}
@media(max-width:560px){main{padding:14px 10px 90px}.mc{padding:14px}.mc .ic{width:64px;height:64px}.hp{min-width:80px}header button{padding:5px 10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

jantung:{t:"Jantung",ic:"jantung",k:"detJantung",cap:"Bagian-bagian jantung (sesuai Gambar 3.3 pada buku)",i:"Jantung tersusun dari otot yang tebal dan kuat. Cara kerjanya ada dua gerakan: mengembang (relaksasi), saat darah masuk ke ruang jantung, dan mengerut (kontraksi), saat darah didorong keluar ke seluruh tubuh. Kedua gerakan itu menghasilkan detak jantung yang bisa dirasakan dan didengar.",
 tabs:[["Vena","Menerima darah dari seluruh tubuh."],["Serambi kanan","Mengalirkan darah kaya CO₂ ke bilik kanan."],["Bilik kanan","Memompa darah kaya CO₂ ke paru-paru."],["Serambi kiri","Mengalirkan darah kaya O₂ dari paru-paru ke bilik kiri."],["Bilik kiri","Memompa darah kaya O₂ ke seluruh tubuh."],["Aorta","Mengalirkan darah ke seluruh tubuh."],["Katup","Menjaga aliran darah tetap searah."],["Arteri paru-paru","Membawa darah kaya CO₂ dari bilik kanan menuju paru-paru."]].map(x=>({t:x[0],b:`<b>${x[0]}</b><br>${x[1]}`,c:"var(--red)"}))},
pembuluh:{t:"Pembuluh Darah",ic:"pembuluh",k:"detPembuluh",cap:"Arteri dan vena (sesuai Gambar 3.4 pada buku)",i:"Pembuluh darah manusia terbagi menjadi tiga jenis: arteri, vena, dan kapiler. Bentuk dan fungsinya berbeda, tetapi ketiganya bekerja sama mengedarkan darah ke seluruh tubuh. Pada gambar, arteri berwarna merah karena kaya oksigen (O₂), sedangkan vena berwarna biru karena kaya karbon dioksida (CO₂).",
 tabs:[{t:"Arteri",c:"var(--red)",b:"<b>Membawa darah keluar dari jantung ke seluruh tubuh.</b><ul><li>Dinding tebal, kuat, dan elastis sehingga tahan tekanan darah tinggi.</li><li>Denyutnya bisa dirasakan di beberapa bagian tubuh.</li><li>Aliran darah lebih cepat daripada vena.</li><li>Letaknya jauh di dalam tubuh, tidak dekat permukaan kulit.</li></ul>"},{t:"Vena",c:"var(--blue)",b:"<b>Membawa darah kembali menuju jantung.</b><ul><li>Dinding lebih tipis dan kurang elastis daripada arteri.</li><li>Memiliki katup agar darah hanya mengalir satu arah.</li><li>Letaknya lebih dekat ke kulit sehingga bisa terlihat.</li><li>Aliran darah lebih lambat daripada arteri.</li></ul>"},{t:"Kapiler",c:"var(--amb)",b:"<b>Pembuluh darah yang sangat kecil.</b><ul><li>Hanya bisa dilihat dengan mikroskop.</li><li>Menghubungkan arteri terkecil (arteriol) dengan vena terkecil (venula).</li><li>Tempat pertukaran oksigen dan karbon dioksida antara darah dan sel-sel tubuh.</li></ul>"}]},
